<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>香港麻雀計分器（全重）</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont;
margin:20px;
font-size:17px;
background:#f2f2f7;
}

h2{
text-align:center;
}

label{
font-weight:600;
display:block;
margin-top:10px;
}

input, select, button{

width:100%;
height:48px;
padding:10px;
font-size:17px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
background:white;
margin-top:5px;
margin-bottom:10px;

}

button{
border:none;
color:white;
font-weight:600;
}

.blue{background:#007aff;}
.red{background:#ff3b30;}

#dealerDisplay{
font-weight:600;
color:#007aff;
margin:10px 0;
}

canvas{
margin-top:20px;
background:white;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
background:white;
}

th,td{
padding:10px;
text-align:center;
border-bottom:1px solid #eee;
}

th{
background:#f8f8f8;
}

</style>
</head>

<body>

<h2>香港麻雀計分器（全重）</h2>

<label>玩家1</label>
<input id="p0" value="A">

<label>玩家2</label>
<input id="p1" value="B">

<label>玩家3</label>
<input id="p2" value="C">

<label>玩家4</label>
<input id="p3" value="D">

<div id="dealerDisplay"></div>

<select id="fan"></select>

<select id="type">
<option value="discard">出銃</option>
<option value="self">自摸</option>
</select>

<select id="winner"></select>

<select id="loser"></select>

<button class="blue" onclick="play()">完成一局</button>

<button class="red" onclick="resetGame()">重置牌局</button>

<canvas id="chart" height="200"></canvas>

<table id="table">

<tr>
<th>局</th>
<th>番</th>
<th>方式</th>
<th>贏家</th>
<th id="n0">A</th>
<th id="n1">B</th>
<th id="n2">C</th>
<th id="n3">D</th>
</tr>

<tr id="totalRow">
<td colspan="4"><b>總計</b></td>
<td>0</td>
<td>0</td>
<td>0</td>
<td>0</td>
</tr>

</table>

<script>

const discardScore={
3:16,4:24,5:32,6:48,7:64,8:96,9:128,10:192,11:256,12:384,13:512
};

const selfScore={
3:24,4:36,5:48,6:72,7:96,8:144,9:192,10:288,11:384,12:576,13:768
};

let dealer=0;
let dealerCount=0;

let total=[0,0,0,0];

let history=[];

const winds=["東風圈","南風圈","西風圈","北風圈"];

function save(){
localStorage.setItem("mahjong",JSON.stringify({
dealer,
dealerCount,
total,
history,
names:getNames()
}));
}

function load(){

let data=localStorage.getItem("mahjong");

if(!data)return;

data=JSON.parse(data);

dealer=data.dealer;
dealerCount=data.dealerCount;
total=data.total;
history=data.history;

let names=data.names;

for(let i=0;i<4;i++)
document.getElementById("p"+i).value=names[i];

updateNames();

history.forEach(addRow);

updateTotal();

drawChart();

updateDealer();

}

function getNames(){
return[
p0.value,
p1.value,
p2.value,
p3.value
];
}

function updateNames(){

let names=getNames();

for(let i=0;i<4;i++)
document.getElementById("n"+i).innerText=names[i];

let winner=document.getElementById("winner");
let loser=document.getElementById("loser");

winner.innerHTML="";
loser.innerHTML="";

names.forEach((n,i)=>{
winner.add(new Option(n,i));
loser.add(new Option(n,i));
});

}

function updateDealer(){

let round=winds[Math.floor(dealerCount/4)%4];

dealerDisplay.innerText="當前莊家："+round+" ‧ "+getNames()[dealer];

}

function play(){

let fan=parseInt(document.getElementById("fan").value);

let type=document.getElementById("type").value;

let winner=parseInt(document.getElementById("winner").value);

let loser=parseInt(document.getElementById("loser").value);

let round=[0,0,0,0];

if(type=="discard"){

if(winner==loser){
alert("出銃者不可等於贏家");
return;
}

let score=discardScore[fan];

round[winner]+=score;
round[loser]-=score;

}else{

let score=selfScore[fan]/3;

for(let i=0;i<4;i++){

if(i==winner)
round[i]+=score*3;
else
round[i]-=score;

}

}

for(let i=0;i<4;i++)
total[i]+=round[i];

history.push({fan,type,winner,loser,round});

addRow({fan,type,winner,loser,round});

updateTotal();

drawChart();

if(winner!=dealer){
dealer=(dealer+1)%4;
dealerCount++;
}

updateDealer();

save();

}

function addRow(data){

let table=document.getElementById("table");

let row=table.insertRow(table.rows.length-1);

row.insertCell(0).innerText=history.length;
row.insertCell(1).innerText=data.fan;
row.insertCell(2).innerText=data.type=="self"?"自摸":"出銃";
row.insertCell(3).innerText=getNames()[data.winner];

for(let i=0;i<4;i++)
row.insertCell(4+i).innerText=data.round[i];

}

function updateTotal(){

let row=document.getElementById("totalRow");

for(let i=0;i<4;i++)
row.cells[i+1].innerText=total[i];

}

function drawChart(){

let ctx=document.getElementById("chart").getContext("2d");

ctx.clearRect(0,0,500,200);

let names=getNames();

let max=Math.max(...total.map(Math.abs),1);

let colors=["red","blue","green","orange"];

for(let i=0;i<4;i++){

let h=total[i]/max*80;

ctx.fillStyle=colors[i];

ctx.fillRect(50+i*80,100-h,40,h);

ctx.fillText(names[i],50+i*80,120);

ctx.fillText(total[i],50+i*80,90-h);

}

}

function resetGame(){

if(!confirm("確定重置？"))return;

localStorage.removeItem("mahjong");

location.reload();

}

for(let i=3;i<=13;i++)
fan.add(new Option(i,i));

updateNames();

updateDealer();

load();

</script>

</body>
</html>
