<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港麻雀計分器（全重）</title>

<style>
body{
font-family:-apple-system;
background:#f2f2f2;
padding:10px;
}

.container{
background:white;
padding:15px;
border-radius:15px;
max-width:700px;
margin:auto;
}

input,select,button{
width:100%;
padding:10px;
margin:5px 0;
font-size:18px;
border-radius:8px;
}

button{
background:#007aff;
color:white;
border:none;
}

.reset{
background:red;
}

.dealer{
color:#007aff;
font-weight:bold;
margin:10px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ccc;
padding:6px;
text-align:center;
}

.totalRow{
background:#eee;
font-weight:bold;
}

canvas{
margin-top:15px;
border:1px solid #ccc;
}
</style>

</head>

<body>

<div class="container">

<h2>香港麻雀計分器（全重）</h2>

<label>玩家1</label>
<input id="name0" value="A">

<label>玩家2</label>
<input id="name1" value="B">

<label>玩家3</label>
<input id="name2" value="C">

<label>玩家4</label>
<input id="name3" value="D">

<div class="dealer" id="dealerDisplay"></div>

<select id="fan"></select>

<select id="type">
<option value="出銃">出銃</option>
<option value="自摸">自摸</option>
</select>

<select id="winner"></select>

<select id="loser"></select>

<button onclick="play()">完成一局</button>

<button class="reset" onclick="resetGame()">重置牌局</button>

<canvas id="chart" width="600" height="200"></canvas>

<table id="table"></table>

</div>

<script>

// 計分表（完全按你張紙）
const SCORE={
3:{d:16,t:24},
4:{d:24,t:36},
5:{d:32,t:48},
6:{d:48,t:72},
7:{d:64,t:96},
8:{d:96,t:144},
9:{d:128,t:192},
10:{d:192,t:288},
11:{d:256,t:384},
12:{d:384,t:576},
13:{d:512,t:768}
};

let history=[];
let total=[0,0,0,0];
let dealer=0;

// 初始化番數
for(let i=3;i<=13;i++){
fan.innerHTML+=`<option>${i}</option>`;
}

function getNames(){
return[
name0.value,
name1.value,
name2.value,
name3.value
];
}

function updateSelectors(){

const names=getNames();

let w=winner.value;
let l=loser.value;

winner.innerHTML="";
loser.innerHTML="";

names.forEach((n,i)=>{
winner.innerHTML+=`<option value="${i}">${n}</option>`;
loser.innerHTML+=`<option value="${i}">${n}</option>`;
});

winner.value=w||0;
loser.value=l||0;

dealerDisplay.innerText="當前莊家："+names[dealer];

}

function play(){

let f=parseInt(fan.value);
let t=type.value;
let w=parseInt(winner.value);
let l=parseInt(loser.value);

let round=[0,0,0,0];

if(t==="出銃"){

if(w===l){
alert("出銃者不能與贏家相同");
return;
}

let amt=SCORE[f].d;

round[w]+=amt;
round[l]-=amt;

}else{

let amt=SCORE[f].t;
let pay=amt/3;

round[w]+=amt;

for(let i=0;i<4;i++){
if(i!==w) round[i]-=pay;
}

}

history.push({
fan:f,
type:t,
winner:w,
round:round
});

for(let i=0;i<4;i++){
total[i]+=round[i];
}

if(w!==dealer){
dealer=(dealer+1)%4;
}

save();
render();

}

function render(){

updateSelectors();

let names=getNames();

let html="<tr><th>局</th><th>番</th><th>方式</th><th>贏家</th>";

names.forEach(n=>html+=`<th>${n}</th>`);

html+="</tr>";

history.forEach((h,i)=>{

html+=`<tr>
<td>${i+1}</td>
<td>${h.fan}</td>
<td>${h.type}</td>
<td>${names[h.winner]}</td>
`;

h.round.forEach(v=>{
html+=`<td>${v}</td>`;
});

html+="</tr>";

});

html+=`<tr class="totalRow">
<td colspan="4">總計</td>
<td>${total[0]}</td>
<td>${total[1]}</td>
<td>${total[2]}</td>
<td>${total[3]}</td>
</tr>`;

table.innerHTML=html;

drawChart();

}

function drawChart(){

let canvas=document.getElementById("chart");
let ctx=canvas.getContext("2d");

ctx.clearRect(0,0,canvas.width,canvas.height);

let names=getNames();

let max=Math.max(...total.map(x=>Math.abs(x)),10);

for(let i=0;i<4;i++){

let value=total[i];

let height=(value/max)*80;

ctx.fillStyle=["red","blue","green","orange"][i];

ctx.fillRect(
50+i*130,
100-height,
50,
height
);

ctx.fillStyle="black";
ctx.fillText(names[i],50+i*130,130);
ctx.fillText(value,50+i*130,90-height);

}

}

function resetGame(){

if(!confirm("確定重置？")) return;

history=[];
total=[0,0,0,0];
dealer=0;

save();
render();

}

function save(){

localStorage.setItem("mj_history",JSON.stringify(history));
localStorage.setItem("mj_total",JSON.stringify(total));
localStorage.setItem("mj_dealer",dealer);

}

function load(){

let h=localStorage.getItem("mj_history");
let t=localStorage.getItem("mj_total");
let d=localStorage.getItem("mj_dealer");

if(h) history=JSON.parse(h);
if(t) total=JSON.parse(t);
if(d) dealer=parseInt(d);

}

load();
render();

</script>

</body>
</html>
