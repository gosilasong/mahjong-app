<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港麻雀計分器</title>
<style>
body{font-family:-apple-system;background:#f2f2f2;padding:10px;text-align:center;}
.container{background:white;border-radius:15px;padding:15px;}
select,button{width:100%;font-size:18px;padding:10px;margin:5px 0;}
.reset{background:red;color:white;}
table{width:100%;margin-top:10px;border-collapse:collapse;}
th,td{border:1px solid #ccc;padding:6px;}
</style>
</head>
<body>
<div class="container">
<h2>香港麻雀計分器（全重）</h2>

<select id="fan"></select>

<select id="type">
<option value="出銃">出銃</option>
<option value="自摸">自摸</option>
</select>

<select id="winner">
<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>
</select>

<select id="loser">
<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>
</select>

<button onclick="play()">完成一局</button>
<button class="reset" onclick="resetGame()">重置牌局</button>

<table id="table"></table>
</div>

<script>

const SCORE={
3:{d:16,t:24},
4:{d:24,t:36},
5:{d:32,t:48},
6:{d:48,t:72},
7:{d:64,t:96},
8:{d:96,t:144},
9:{d:128,t:192},
10:{d:192,t:288},
11:{d:256,t:384},
12:{d:384,t:576},
13:{d:512,t:768}
};

let history=[];
let total=[0,0,0,0];

for(let i=3;i<=13;i++){
fan.innerHTML+=`<option>${i}</option>`;
}

function play(){

let f=parseInt(fan.value);
let typeValue=type.value;
let w=parseInt(winner.value);
let l=parseInt(loser.value);

let round=[0,0,0,0];

if(typeValue==="出銃"){

let amount=SCORE[f].d;

round[w]+=amount;
round[l]-=amount;

}else{

let amount=SCORE[f].t;
let pay=amount/3;

round[w]+=amount;

for(let i=0;i<4;i++){
if(i!==w){
round[i]-=pay;
}
}

}

for(let i=0;i<4;i++){
total[i]+=round[i];
}

history.push({fan:f,type:typeValue,winner:w,round:round.slice()});

render();

}

function render(){

let html="<tr><th>局</th><th>番</th><th>方式</th><th>贏家</th><th>A</th><th>B</th><th>C</th><th>D</th></tr>";

history.forEach((h,i)=>{
html+=`<tr>
<td>${i+1}</td>
<td>${h.fan}</td>
<td>${h.type}</td>
<td>${["A","B","C","D"][h.winner]}</td>
<td>${h.round[0]}</td>
<td>${h.round[1]}</td>
<td>${h.round[2]}</td>
<td>${h.round[3]}</td>
</tr>`;
});

html+=`<tr style="font-weight:bold;background:#eee;">
<td colspan="4">總計</td>
<td>${total[0]}</td>
<td>${total[1]}</td>
<td>${total[2]}</td>
<td>${total[3]}</td>
</tr>`;

table.innerHTML=html;

}

function resetGame(){
history=[];
total=[0,0,0,0];
render();
}

render();

</script>
</body>
</html>
