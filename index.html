<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港麻雀計分器（全重）</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont;
margin:20px;
font-size:17px;
background:#f2f2f7;
}

label{
font-weight:600;
display:block;
margin-top:10px;
}

input, select, button{
width:100%;
height:48px;
padding:10px;
font-size:17px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
background:white;
margin-bottom:10px;
}

button{
border:none;
color:white;
font-weight:600;
}

.blue{background:#007aff;}
.red{background:#ff3b30;}
.gray{background:#8e8e93;}
.green{background:#34c759;}

#dealerDisplay{
font-weight:600;
color:#007aff;
margin:10px 0;
}

canvas{
margin-top:20px;
background:white;
border-radius:12px;
width:100%;
height:220px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
background:white;
table-layout:fixed;
}

th,td{
padding:10px;
text-align:center;
border-bottom:1px solid #eee;
}

th{
background:#f8f8f8;
}

</style>
</head>

<body>

<h2>香港麻雀計分器（全重）</h2>

<label>玩家1</label>
<input id="p0" value="A" onchange="updateNamesAll()">

<label>玩家2</label>
<input id="p1" value="B" onchange="updateNamesAll()">

<label>玩家3</label>
<input id="p2" value="C" onchange="updateNamesAll()">

<label>玩家4</label>
<input id="p3" value="D" onchange="updateNamesAll()">

<div id="dealerDisplay"></div>

<label>番數</label>
<select id="fan"></select>

<label>方式</label>
<select id="type" onchange="updateTypeUI()">
<option value="discard">出銃</option>
<option value="self">自摸</option>
</select>

<label id="winnerLabel">贏家</label>
<select id="winner"></select>

<label id="loserLabel">出銃者</label>
<select id="loser"></select>

<button class="blue" onclick="play()">完成一局</button>

<button class="gray" onclick="undo()">Undo（撤回）</button>

<button class="green" onclick="exportExcel()">匯出 Excel</button>

<button class="red" onclick="resetGame()">重置牌局</button>

<canvas id="chart"></canvas>

<table id="table">

<tr>
<th>局</th>
<th>番</th>
<th>方式</th>
<th>贏家</th>
<th id="n0">A</th>
<th id="n1">B</th>
<th id="n2">C</th>
<th id="n3">D</th>
</tr>

<tr id="totalRow">
<td colspan="4"><b>總計</b></td>
<td>0</td>
<td>0</td>
<td>0</td>
<td>0</td>
</tr>

</table>

<script>

const discardScore={3:16,4:24,5:32,6:48,7:64,8:96,9:128,10:192,11:256,12:384,13:512};
const selfScore={3:24,4:36,5:48,6:72,7:96,8:144,9:192,10:288,11:384,12:576,13:768};

let dealer=0;
let dealerCount=0;

let total=[0,0,0,0];
let history=[];

const winds=["東風圈","南風圈","西風圈","北風圈"];

function getNames(){
return[p0.value,p1.value,p2.value,p3.value];
}

function updateNamesAll(){

let names=getNames();

let winnerSelect=winner;
let loserSelect=loser;

let wVal=winnerSelect.value;
let lVal=loserSelect.value;

winnerSelect.innerHTML="";
loserSelect.innerHTML="";

for(let i=0;i<4;i++){

let opt=document.createElement("option");
opt.value=i;
opt.text=names[i];
winnerSelect.appendChild(opt);

let opt2=document.createElement("option");
opt2.value=i;
opt2.text=names[i];
loserSelect.appendChild(opt2);

document.getElementById("n"+i).innerText=names[i];

}

if(wVal) winnerSelect.value=wVal;
if(lVal) loserSelect.value=lVal;

updateDealer();
drawChart();

}

function updateDealer(){

let round=winds[Math.floor(dealerCount/4)%4];

dealerDisplay.innerText="當前莊家："+round+" ‧ "+getNames()[dealer];

}

function updateTypeUI(){

if(type.value=="self"){

loser.style.display="none";
loserLabel.style.display="none";

}else{

loser.style.display="block";
loserLabel.style.display="block";

}

}

function initFan(){

for(let i=3;i<=13;i++){

let opt=document.createElement("option");
opt.value=i;
opt.text=i+" 番";
fan.appendChild(opt);

}

}

function play(){

let fanVal=parseInt(fan.value);
let typeVal=type.value;
let w=parseInt(winner.value);
let l=parseInt(loser.value);

let round=[0,0,0,0];

if(typeVal=="discard"){

if(w==l){
alert("出銃者不可等於贏家");
return;
}

let score=discardScore[fanVal];

round[w]+=score;
round[l]-=score;

}else{

let score=selfScore[fanVal]/3;

for(let i=0;i<4;i++){

if(i==w) round[i]+=score*3;
else round[i]-=score;

}

}

for(let i=0;i<4;i++)
total[i]+=round[i];

history.push({fan:fanVal,type:typeVal,winner:w,round});

addRow(history.length,fanVal,typeVal,w,round);

updateTotal();
drawChart();

if(w!=dealer){
dealer=(dealer+1)%4;
dealerCount++;
}

updateDealer();

}

function addRow(no,fan,type,w,round){

let row=table.insertRow(table.rows.length-1);

row.insertCell(0).innerText=no;
row.insertCell(1).innerText=fan;
row.insertCell(2).innerText=type=="self"?"自摸":"出銃";
row.insertCell(3).innerText=getNames()[w];

for(let i=0;i<4;i++)
row.insertCell(4+i).innerText=round[i];

}

function updateTotal(){

for(let i=0;i<4;i++)
totalRow.cells[i+1].innerText=total[i];

}

function undo(){

if(history.length==0)return;

let last=history.pop();

for(let i=0;i<4;i++)
total[i]-=last.round[i];

table.deleteRow(table.rows.length-2);

updateTotal();
drawChart();

}

function exportExcel(){

let csv="局,番,方式,贏家,"+getNames().join(",")+"\n";

history.forEach((h,i)=>{
csv+=(i+1)+","+h.fan+","+
(h.type=="self"?"自摸":"出銃")+","+
getNames()[h.winner]+","+
h.round.join(",")+"\n";
});

csv+="總計,,,,"+total.join(",");

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="mahjong.csv";
a.click();

}

function drawChart(){

let ctx=chart.getContext("2d");

chart.width=chart.offsetWidth;
chart.height=220;

ctx.clearRect(0,0,chart.width,chart.height);

let names=getNames();
let max=Math.max(...total.map(Math.abs),1);

let spacing=chart.width/5;
let colors=["red","blue","green","orange"];

for(let i=0;i<4;i++){

let x=spacing*(i+1);
let h=(total[i]/max)*80;

ctx.fillStyle=colors[i];
ctx.fillRect(x-20,120-h,40,h);

ctx.fillText(names[i],x-20,140);
ctx.fillText(total[i],x-20,110-h);

}

}

function resetGame(){
location.reload();
}

initFan();
updateNamesAll();
updateDealer();
updateTypeUI();
drawChart();

</script>

</body>
</html>
